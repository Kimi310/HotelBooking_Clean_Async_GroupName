name: Postman API Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  postman-api-tests:
    name: Postman CreateBooking API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Web API
        run: dotnet build HotelBooking.WebApi/HotelBooking.WebApi.csproj --configuration Release

      # Development seeds the customers (ids 1 and 2) and rooms the collection needs.
      # --no-launch-profile makes sure launchSettings.json can't change the environment or URL.
      - name: Start Web API in background
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --project HotelBooking.WebApi/HotelBooking.WebApi.csproj \
            --configuration Release --no-build --no-launch-profile --urls http://localhost:5000 > webapi.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5000/rooms; then
              echo "Web API is up"
              exit 0
            fi
            sleep 2
          done
          echo "Web API did not start in time. Log:"
          cat webapi.log
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman CreateBooking collection
        run: >
          newman run Postman/HotelBooking_CreateBooking.postman_collection.json
          --env-var "baseUrl=http://localhost:5000"
          --insecure

      - name: Upload Web API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapi-log
          path: webapi.log
